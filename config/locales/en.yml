# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  layouts:
    application:
      name: "Tic-tac-evolve"

  matches:
    index:
      title: "Play | tic-tac-evolve"
      history:
        empty: "No matches yet."
    setup_heading:
      heading: "Tic-tac-evolve"
      eyebrow: "THREE IN A ROW"
    setup_fields:
      modes:
        local: "Two players"
        computer: "Computer"
      opponent: "Opponent"
      difficulty: "Difficulty"
      start_button: "Start match"
      starts: "%{mark} starts"
    history_heading:
      heading: "Match history"
      page: "PAGE %{number}"
    history_item:
      complete: "Complete"
      active: "Active"
      view: "View match"
      resume: "Resume"
      view_label: "View match %{number}"
      resume_label: "Resume match %{number}"
    history_pagination:
      previous: "Previous"
      next: "Next"
      label: "Match history pages"
    show:
      title: "Match #%{number} | tic-tac-evolve"
      eyebrow: "MATCH %{number}"
      new_match: "New match"

    board:
      board_label: "Tic-tac-toe board"
      square_label: "Square %{number}, %{mark}"
      empty: "empty"

    status:
      draw: "Draw"
      wins: "%{winner} wins"
      to_move: "%{mark} to move"

    mode_label:
      computer: "Computer / %{strategy}"
