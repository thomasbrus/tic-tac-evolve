    strategies:
      random: "Random"
      easy: "Easy"
      medium: "Medium"
      hard: "Hard"

    errors:
      board_changed: "The board changed. Choose a move on the current board."
      match_complete: "This match is already complete."
      invalid_move: "Choose an empty square from 1 to 9."

  activerecord:
    models:
      match: "Match"
    attributes:
      match:
        mode: "Mode"
        strategy: "Strategy"
        cells: "Board"
