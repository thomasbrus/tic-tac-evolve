name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Read Ruby version
        id: ruby-version
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"
      - name: Restore Ruby installation
        id: ruby-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/hostedtoolcache/Ruby/${{ steps.ruby-version.outputs.version }}
          key: ruby-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('.ruby-version') }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Save Ruby installation
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/hostedtoolcache/Ruby/${{ steps.ruby-version.outputs.version }}
          key: ${{ steps.ruby-cache.outputs.cache-primary-key }}
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Run non-browser tests
        run: bin/rails test test
      - name: Build Tailwind CSS 4
        run: bin/rails tailwindcss:build
      - name: Check Rails loading
        run: bin/rails zeitwerk:check
